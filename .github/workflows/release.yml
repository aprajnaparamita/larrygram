name: Release

# Alpha packages for the testers (task R9 goal 5). A pushed tag `v*`
# (or a run started by hand) builds the three release packages on
# their native runners and uploads them as artifacts; on a tag the
# last job additionally writes SHA256SUMS and creates a GitHub
# pre-release with the three packages and the sums.
#
# The builds are unsigned (task R9 decisions); `docs/building/testers.md`
# tells the testers how to open them and how to report a bug.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only everywhere by default; only the release job below gets
# `contents: write` (task R9 goal 5). No secrets beyond the
# repository's own GITHUB_TOKEN.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: dist (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-14
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # rust-toolchain.toml pins the stable toolchain, components and
      # wasm target; rustup installs it on first cargo invocation.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Each platform builds its own package on its native runner
      # (task R9 goal 5); `cargo xtask dist` refuses any other host.
      - name: Build the package
        run: cargo xtask dist ${{ matrix.platform }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: larrygram-${{ matrix.platform }}
          path: target/dist/Larrygram-*
          if-no-files-found: error

  # Tags only: write SHA256SUMS and create the GitHub pre-release with
  # the three packages and the sums (task R9 goal 5).
  release:
    name: pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: packages
          merge-multiple: true

      - name: Write SHA256SUMS
        run: |
          cd packages
          sha256sum Larrygram-* > SHA256SUMS
          cat SHA256SUMS

      # The release-notes template (task R9 goal 5): our own words,
      # with the tag filled in. Kept in this file on purpose.
      - name: Write the release notes
        run: |
          cat > notes.md <<'EOF'
          # Larrygram alpha build

          Unsigned, no installer. Download the package for your system and
          check it against `SHA256SUMS` before opening it:

          - `Larrygram-<version>-macos-arm64.dmg`
          - `Larrygram-<version>-windows-x64.zip`
          - `Larrygram-<version>-linux-x64.tar.gz`

          How to verify the checksum, open an unsigned build and report a
          bug: `docs/building/testers.md` in the repository.

          Known limits of this alpha: Visio `.vsd` import is read-only, and
          the brand art is all rights reserved (README "License").
          EOF

      - name: Create the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "Larrygram $GITHUB_REF_NAME (alpha)" \
            --notes-file notes.md \
            packages/Larrygram-* packages/SHA256SUMS
