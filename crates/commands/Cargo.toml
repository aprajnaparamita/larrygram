[package]
name = "larrygram-commands"
description = "Command registry, undo/redo and selection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# The registry runs over the model, the renderer and the readers (ADR 0028),
# and takes its ids and layout kinds from the ui-spec data (ADRs 0006, 0029).
# `serde` is for the persisted `Settings` only (ADR 0029); `serde_json`
# writes the `file.inspect` JSON summary. The `commands.yaml` stub rows
# come through `larrygram-ui-spec`'s loader (one parse path, P4-15).
# Licences checked by cargo deny.
larrygram-geom = { path = "../geom" }
larrygram-model = { path = "../model" }
larrygram-render = { path = "../render" }
# The recalc hook after an edit (ADR 0056) drives the ShapeSheet engine.
larrygram-shapesheet = { path = "../shapesheet" }
# The binary `.vsd`/`.vss`/`.vst` import of the open path (P8-09, ADR 0070):
# `file.open` and the CLI route those extensions here. MPL-2.0, the one
# allowed MPL crate (ADR 0003).
larrygram-vsd-binary = { path = "../vsd-binary" }
larrygram-ui-spec = { path = "../ui-spec" }
larrygram-vsdx = { path = "../vsdx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
