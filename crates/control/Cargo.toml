[package]
name = "larrygram-control"
description = "JSON control channel and MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# The registry and its state (ADR 0076, ADR 0077): every remote action
# dispatches through `larrygram-commands`; inspection reads the model and
# rendering builds a scene (ADRs 0078, 0079). L5 over L0..L4 (ADR 0002).
larrygram-commands = { path = "../commands" }
larrygram-geom = { path = "../geom" }
larrygram-model = { path = "../model" }
larrygram-render = { path = "../render" }
# The wire (ADR 0075): JSON-RPC 2.0 messages as serde types. MIT OR
# Apache-2.0, already in the tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Inline PNG bytes on the wire and in MCP image content (ADR 0079,
# ADR 0080). MIT OR Apache-2.0, already in the tree (0.22).
base64 = "0.22"
# The socket token (ADR 0081): 32 bytes from the operating system's
# random source. MIT OR Apache-2.0, already in the tree (0.3).
getrandom = "0.3"

[lints]
workspace = true
