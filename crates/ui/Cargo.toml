[package]
name = "larrygram-ui"
description = "egui user interface: the command bar, canvas, panes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# The GUI stack (ADR 0030): egui for widgets, rfd for native file dialogs
# (ADR 0036). Nothing below L6 sees these crates (ADR 0002). Licences
# checked by cargo deny. `default_fonts` bundles egui's own UFL-1.0 font
# for the chrome text (ADR 0030 "Fonts in the UI chrome").
egui = { version = "0.37", features = ["default_fonts"] }
rfd = "0.17"
larrygram-commands = { path = "../commands" }
larrygram-geom = { path = "../geom" }
larrygram-model = { path = "../model" }
# The ShapeSheet engine (ADR 0052): the panes type a cached value with
# `Value::from_cached` and parse a typed entry with the formula grammar
# and the engine's unit table (ADR 0058, task P6-09; requested here
# because the panes need the typed mapping in their own code).
larrygram-shapesheet = { path = "../shapesheet" }
larrygram-render = { path = "../render" }
larrygram-ui-spec = { path = "../ui-spec" }
# The settings slot format (ADR 0032): `Settings` as JSON in the
# eframe storage key. MIT OR Apache-2.0 (already in the tree).
serde_json = "1"
# The image loaders for the brand art and the icon set (ADR 0067):
# `svg` draws SVGs through resvg, `image` decodes raster images through
# the `image` crate, here PNG only. No file or HTTP loader: every image
# is embedded. MIT OR Apache-2.0 / Zlib / BSD (checked by cargo deny).
egui_extras = { version = "0.37", default-features = false, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# The icon rasteriser (ADR 0062, task P7-04): the same resvg 0.45 that
# the egui_extras `svg` loader pins, with no text or raster-image
# features because the icon set is outline paths only. MIT OR
# Apache-2.0 (already in the tree through egui_extras).
resvg = { version = "0.45.1", default-features = false }
# One warning per missing icon key or rasterisation failure (ADR 0062).
# MIT OR Apache-2.0 (already in the tree through egui).
log = "0.4"

# The wasm picker bridge (ADR 0036): `wasm-bindgen-futures` completes
# rfd's async upload dialog on the browser event loop and `web-sys`
# downloads the saved bytes (rfd has no wasm save). All are MIT OR
# Apache-2.0 (already in the tree through eframe; ADR 0030).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "HtmlElement",
    "Url",
    "Window",
] }

[dev-dependencies]
# Headless UI tests (ADR 0030, ADR 0037).
egui_kittest = "0.37"
# Counts pinned per layout (ADR 0037, P4-04).
insta = "1"
# Property tests (ADR 0037; the settings-slot round trip, P4-16).
proptest = "1"
# Parses the committed YAML in the tests only (the runtime loader is
# `larrygram-ui-spec`'s; MIT, the same YAML parser `xtask` uses, ADR
# 0007): the `contexts.yaml` and layout cross-check (P7-08) and the
# Panel Classic count pin (`ui-spec/layouts/panel-classic.yaml`).
serde-saphyr = "1.3"

[lints]
workspace = true
