[package]
name = "larrygram-vsd-binary"
description = "Read-only import of binary .vsd/.vss/.vst (derived from libvisio)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
# Units for the cell values (layer L0, ADR 0002).
larrygram-geom = { path = "../geom" }
# The document model the importer fills (layer L1, ADR 0002). Same
# dependency the `.vsdx` reader uses, so both produce one model.
larrygram-model = { path = "../model" }
# The unit type of the model's cells (layer L0): the text mapping sets
# the declared unit of the rows it writes (ADR 0070's unit rule).
larrygram-geom = { path = "../geom" }

[lints]
workspace = true
