[package]
name = "larrygram-ui-spec"
description = "Loader for command bar, menu and shortcut layout data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
# Default features off: they pull in reqwest/rustls for remote $ref
# resolution, which we do not need (ui-spec/schema.json only uses
# internal $refs) and whose webpki-root-certs dependency is not an
# allowed licence in deny.toml.
jsonschema = { version = "0.58", default-features = false }
thiserror = "2"

[dev-dependencies]
# Property tests (P1-08 goal 4) and malformed-input tests (goal 5).
proptest = "1"
# Snapshot pins for the v1-to-v2 adapter output and the per-layout
# count pins (ADR 0065, task P7-03).
insta = "1"

[lints]
workspace = true
