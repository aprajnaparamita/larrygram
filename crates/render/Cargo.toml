[package]
name = "larrygram-render"
description = "Scene graph, PNG and SVG rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# Scene graph backends and style data (ADR 0023, ADR 0025). Pure Rust and
# wasm-compatible; licences checked by cargo deny.
larrygram-geom = { path = "../geom" }
larrygram-model = { path = "../model" }
larrygram-text = { path = "../text" }
tiny-skia = "0.12"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"

[dev-dependencies]
# Corpus tests (tests/build_scene.rs) read real `.vsdx` files through the
# package reader (task P3-05).
larrygram-vsdx = { path = "../vsdx" }
quick-xml = "0.41" # parses the SVG output in tests (P3-07)
# Golden SVG text snapshots (tests/svg_snapshot.rs) and the scene-builder
# property tests (tests/scene_properties.rs), task P3-10 (ADR 0027).
insta = "1"
proptest = "1"
# Decodes `render_png` output to compare it with `render_raster` bytes
# (tests/raster.rs, task P4-05). Already in the tree through
# tiny-skia's `png-format` feature; no new crate in the supply chain.
png = "0.18"
# Binary `.vsd` import for the end-to-end corpus tests
# (tests/corpus_vsd.rs, task P8-10): the corpus drawings import, render
# and round-trip through the `.vsdx` writer.
larrygram-vsd-binary = { path = "../vsd-binary" }

[lints]
workspace = true
