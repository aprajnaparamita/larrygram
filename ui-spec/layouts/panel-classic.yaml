        begin_group: true
    - id: drawing.file.open
      kind: button
      label: Open...
      access: "o"
      command: file.open
      visuicmd: visCmdFileOpen
      shortcut: Ctrl+O
      icon: file.open
    - id: drawing.file.close
      kind: button
