# Larrygram Panel Classic layout (layout format v2, docs/ui/layout-format.md).
# Menu bar, toolbars and context menus. Labels are short UI labels;
# `command` links to ui-spec/commands.yaml, `icon` to ui-spec/icons.yaml.
schema_version: 2
id: panel-classic
name: Panel Classic
kind: panel-classic
description: Menu bar and docked toolbars above the drawing window.
theme: panel-classic
window:
  regions:
  - id: title_bar
    edge: top
    size: 23
  - id: menu_bar
    edge: top
    size: 24
    notes: Menus left; a help search box at the right end.
  - id: toolbars
    edge: top
    size: 26
    per_row: true
    notes: Docked toolbar rows; Standard on row 0, Formatting on row 1.
  - id: shapes_window
    edge: left
    size: 190
    notes: 'Docked Shapes window: title row, search box, stencils.'
  - id: rulers
    edge: top_left_of_drawing
    size: 16
  - id: drawing
    edge: fill
  - id: page_tabs
    edge: bottom_of_drawing
    size: 18
    notes: First/previous/next/last page buttons, page tabs, then the horizontal scroll bar.
  - id: status_bar
    edge: bottom
    size: 20
    notes: Shape geometry fields on the left; page n/m on the right.
menu_bars:
- id: drawing
  label: Drawing menu bar
  menus:
  - id: drawing.file
    label: File
    access: "f"
    items:
    - id: drawing.file.new
      kind: submenu
      label: New
      access: "n"
      icon: classic.drawing.file.new
      items:
      - id: drawing.file.new.getting_started
        kind: button
        label: Getting Started...
        access: "g"
        command: file.create.new.drawing
        visuicmd: visCmdCreateNewDrawing
      - id: drawing.file.new.new_drawing
        kind: button
        label: New Drawing
        access: "n"
        command: file.new.blank.drawing
        visuicmd: visCmdFileNewBlankDrawing
        shortcut: Ctrl+N
        icon: file.new.blank.drawing
      - id: drawing.file.new.new_drawing_metric
        kind: button
        label: New Drawing (Metric)
        access: "e"
        command: file.new.blank.drawing.metric
        visuicmd: visCmdFileNewBlankDrawingMetric
        icon: file.new.blank.drawing.metric
      - id: drawing.file.new.new_drawing_us_units
        kind: button
        label: New Drawing (US Units)
        access: "e"
        command: file.new.blank.drawing.us
        visuicmd: visCmdFileNewBlankDrawingUS
