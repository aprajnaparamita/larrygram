      command: edit.paste
      fluent: PasteMenu
      size: large
      column: 0
      row: 0
      icon: edit.paste
      items:
      - id: tab.home.clipboard.paste.paste
        kind: button
        label: Paste
        command: edit.paste
        fluent: Paste
        icon: edit.paste
      - id: tab.home.clipboard.paste.paste_special
        kind: button
        label: Paste Special...
        command: edit.paste.special.dialog
        fluent: PasteSpecialDialog
        icon: edit.paste.special.dialog
      - id: tab.home.clipboard.paste.paste_as_hyperlink
        kind: button
        label: Paste as Hyperlink
        command: tools.inet.paste.as.hyperlink
        fluent: PasteAsHyperlink
        icon: tools.inet.paste.as.hyperlink
      - id: tab.home.clipboard.paste.duplicate
        kind: button
        label: Duplicate
        command: edit.paste.duplicate
        fluent: PasteDuplicate
        icon: edit.paste.duplicate
    - id: tab.home.clipboard.cut
      kind: button
      label: Cut
      command: edit.cut
      fluent: Cut
      size: medium
      column: 1
      row: 0
      icon: edit.cut
    - id: tab.home.clipboard.copy
      kind: button
