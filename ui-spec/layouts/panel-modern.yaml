# Larrygram Panel Modern layout (layout format v2, docs/ui/layout-format.md).
# Tabs in display order; group controls carry their column/row slot.
# `command` links to ui-spec/commands.yaml, `icon` to ui-spec/icons.yaml,
# `fluent` to the Fluent control id where one exists.
schema_version: 2
id: panel-modern
name: Panel Modern
kind: panel-modern
description: Tabbed command bar with a File view, a Quick Access Toolbar and contextual tabs.
theme: panel-modern
window:
  regions:
  - id: title_bar
    edge: top
    size: 25
    notes: Quick Access Toolbar at the left, document title centred, help and window buttons at the right.
  - id: tab_strip
    edge: top
    size: 25
    notes: File button, then the tabs; contextual tab sets appear to the right of the core tabs under
      a coloured set caption.
  - id: command_bar
    edge: top
    size: 93
    collapsible: true
    notes: Groups left to right with captions along the bottom edge; a collapse button at the far right.
  - id: shapes_window
    edge: left
    size: 262
    notes: 'Shapes window: title, STENCILS and SEARCH headings, then stencil sections.'
  - id: rulers
    edge: top_left_of_drawing
    size: 16
  - id: drawing
    edge: fill
  - id: page_tabs
    edge: bottom_of_drawing
    size: 40
    notes: Page tabs, an All-pages menu and an insert-page button below the horizontal scroll bar.
  - id: status_bar
    edge: bottom
    size: 22
    notes: Page n of m and language on the left; presentation, zoom slider, zoom percent, fit-page and
      switch-window buttons on the right.
quick_access_toolbar:
- id: qat.save
  kind: button
  label: Save
  command: file.save
  fluent: FileSave
  icon: file.save
- id: qat.undo
  kind: split
  label: Undo
  command: edit.undo
  fluent: Undo
  icon: edit.undo
  dynamic_label: true
- id: qat.redo
  kind: button
  label: Redo
  command: edit.redo.or.repeat
  fluent: RedoOrRepeat
  dynamic_label: true
- id: qat.customize
  kind: dropdown
  label: Customize Quick Access Toolbar
  command: view.qat.customize
  new_command: true
file_button:
  label: File
  opens: file_view
tabs:
