      size: medium
      column: 1
      row: 2
      icon: tools.format_painter
  - id: tab.home.font
    label: Font
    layout: rows
    fluent: GroupFont
    controls:
    - id: tab.home.font.font
      kind: combo
      label: Font
      command: text.font
      fluent: Font
      column: 0
      row: 0
      width: 107
    - id: tab.home.font.font_size
