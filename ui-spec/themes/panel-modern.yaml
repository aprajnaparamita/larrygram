# Larrygram Panel Modern theme tokens (docs/ui/themes.md).
# Colours are sRGB hex; sizes are logical pixels at 100% scaling.
schema_version: 1
id: panel-modern
name: Panel Modern (white)
fonts:
  ui: {family: Selawik, size_px: 12}
  tab: {family: Selawik, size_px: 12, transform: uppercase}
  group_caption: {family: Selawik, size_px: 12}
  title: {family: Selawik, size_px: 12}
  pane_title: {family: Selawik Light, size_px: 22}
colors:
  accent: '#3955a3'                   # File button, status bar, selected tab text, pane titles
  accent.text: '#ffffff'              # text on the accent colour
  chrome.background: '#ffffff'        # tab strip, command-bar body
  chrome.title_bar: '#ffffff'
  chrome.text: '#444444'
  chrome.text_disabled: '#989898'
  chrome.separator: '#d4d4d4'
  chrome.border: '#d4d4d4'            # selected tab outline, command-bar bottom edge
  # Menus (the Panel Classic menu widget draws every menu, including
  # the context menus of this layout).
  menu.background: '#ffffff'
  menu.gutter: '#f3f3f3'
  menu.border: '#bebebe'
  menu.separator: '#d4d4d4'
  menu.highlight.fill: '#d5e1f2'      # hovered item
  menu.highlight.border: '#c2d5f2'
  menu.bar.open.fill: '#c2cff2'       # the open top-level menu title
  menu.bar.open.border: '#a3bde3'
  group.separator: '#e1e1e1'
  group.caption.text: '#666666'
  tab.selected.text: '#3955a3'
  tab.text: '#444444'
  button.pressed.fill: '#c2cff2'      # a latched tool or toggle (Pointer Tool)
  button.pressed.border: '#a3bde3'    # provisional
  button.hover.fill: '#d5e1f2'        # provisional
  button.hover.border: '#c2d5f2'      # provisional
  contextual.green.band: '#49a349'    # 4 px strip above the tab-set caption
  contextual.green.fill: '#e6f3e6'
  contextual.green.text: '#067006'
  contextual.orange.band: '#ff9d00'
  contextual.orange.fill: '#fff8ed'
  contextual.orange.text: '#c45300'
  pane.background: '#ffffff'
  pane.title.fill: '#ffffff'
  pane.title.text: '#3955a3'
  pane.border: '#d4d4d4'
  canvas.background: '#fbfbfb'        # area around the page
  page.background: '#ffffff'
  page.border: '#a9b0b8'
  page.shadow: '#eaeaea'
  ruler.background: '#ffffff'
  ruler.ticks: '#444444'
  status_bar.background: '#3955a3'
  status_bar.text: '#ffffff'
  page_tab.active.text: '#3955a3'
  page_tab.text: '#444444'
  file_view.nav.background: '#3955a3'
  file_view.nav.text: '#ffffff'
  file_view.nav.selected: '#4d6ab8'
  file_view.background: '#ffffff'
  tooltip.background: '#ffffff'
  field.background: '#ffffff'
  tooltip.border: '#bebebe'           # provisional
  # Icon tints (ui-spec/icons.yaml): our own palette, not sampled.
  icon.neutral: '#444444'
  icon.blue: '#2b6cc4'
  icon.green: '#3a8a2e'
  icon.red: '#c8322a'
  icon.orange: '#d9831f'
  icon.yellow: '#d4a514'
  icon.purple: '#7b4bb3'
contextual_tab_sets:
  picture_tools: green
  container_tools: orange
  shapesheet_tools: green
metrics:
  title_bar.height: 25
  qat.button: {width: 22, height: 22}
  tab_strip.height: 25
  tab.padding_x: 12
  file_button.width: 59
  command_bar.height: 92
  command_bar.padding_top: 2
  group.padding_x: 4
  group.caption.height: 17
  group.separator.width: 1
  launcher: {width: 16, height: 17}   # bottom-right corner of the group caption row
  button.large: {min_width: 42, height: 69, icon: 32}
  button.medium: {height: 23, icon: 16}   # icon and label side by side
  button.small: {width: 22, height: 23, icon: 16}  # icon only
  split.arrow.width: 12
  stack.rows: 3
  stack.row.height: 23
  rows.row.height: 23                 # two flowing rows (Font, Paragraph groups)
  rows.gap: 8
  combo.height: 23
  check.size: 13
  shapes_window.width: 262
  ruler.size: 16
  page_tabs.height: 40
  status_bar.height: 22
  file_view.nav.width: 123
  file_view.nav.row.height: 38
  # The Panel Classic metrics (`ClassicMetrics` reads them against
  # every theme: the menus of this layout draw with the same numbers
  # the Panel Classic chrome uses).
  menu_bar.height: 24
  menu_bar.item.padding_x: 7
  toolbar.row.height: 26
  toolbar.button: {width: 23, height: 22}
  toolbar.split_arrow.width: 11
  toolbar.separator: {width: 1, margin: 3}
  toolbar.gripper.width: 7
  combo.font.width: 144
  combo.font_size.width: 86
  combo.zoom.width: 65
  menu.row.height: 23
  menu.separator.height: 3
  menu.gutter.width: 24
  menu.icon: 16
  menu.padding_x: 8
  menu.shortcut.gap: 24
  menu.submenu_arrow.width: 12
  icon.small: 16
