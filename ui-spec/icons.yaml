# Icon map: icon key (a command id, or a layout item id) -> Tabler outline icon.
# Icons chosen by meaning; tint names a theme token (ui-spec/themes/*.yaml).
# Keys without a row draw the placeholder mark (crates/ui/src/icons.rs).
schema_version: 1
set:
  name: Tabler Icons
  version: 3.49.0
  license: MIT
  style: outline
  source: https://registry.npmjs.org/@tabler/icons/-/icons-3.49.0.tgz
  path: crates/ui/assets/icons/tabler
fallback: placeholder
tints:
  icon.neutral: draw with the theme's icon colour (default)
  icon.blue: accent blue
  icon.green: accent green
  icon.red: accent red
  icon.orange: accent orange
  icon.yellow: accent yellow
  icon.purple: accent purple
