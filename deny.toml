# cargo-deny configuration. Run with `cargo deny check` (part of `cargo xtask gate`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0192: `ttf-parser` is unmaintained. It reaches us only
# through `winit` -> `sctk-adwaita` -> `ab_glyph` (Wayland window
# decorations), for font parsing of our own UI chrome. No vulnerability,
# no fixed release exists; revisit when winit replaces the dependency
# (ADR 0030).
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "transitive via winit (sctk-adwaita/ab_glyph); unmaintained, no fix available" },
    # zbus/zvariant: eframe's Linux accessibility bridge (egui-winit ->
    # accesskit_unix -> atspi/zbus). Unmaintained notices with no safe
    # upgrade; revisit when egui moves to a maintained D-Bus stack.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via eframe/accesskit_unix (Linux a11y); unmaintained, no fix available" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via eframe/accesskit_unix (Linux a11y); unmaintained, no fix available" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via eframe/accesskit_unix (Linux a11y); unmaintained, no fix available" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Allowances are listed up front for crates we expect (fonts, unicode, GUI stack).
unused-allowed-license = "allow"
# Permissive licenses only. MPL-2.0 is NOT in this list: it is allowed solely
# for larrygram-vsd-binary via the exception below (see ADR 0003).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "OFL-1.1",
]

[[licenses.exceptions]]
crate = "larrygram-vsd-binary"
allow = ["MPL-2.0"]

# egui's dependency-supplied chrome fonts (ADR 0030): the epaint default
# font set is (MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0. The
# Ubuntu Font Licence v1.0 is permissive (free use, modification and
# redistribution with the notice kept); no Microsoft font is involved.
# A row in ATTRIBUTION.md records the set (task P4-03).
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["MIT", "Apache-2.0", "OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
# Check our own workspace crates too, so a stray MPL license anywhere else fails.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
