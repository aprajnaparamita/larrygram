[package]
name = "larrygram-xtask"
description = "Larrygram developer tasks: quality gate, coverage ratchet, layering check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"          # RustCrypto; the git blob ids of the wide corpus (P8-16)
toml = "0.9"
# rustls with the ring provider, but no bundled webpki-roots (that crate is
# CDLA-Permissive-2.0, not in deny.toml). We load the OS root store ourselves
# via rustls-native-certs below.
rustls-native-certs = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring"] }
roxmltree = "0.21.1"

# P4-09: the parity matrix derives `implemented` rows from the builtin
# registry (ADR 0037). xtask is L9 and may depend on any lower layer.
larrygram-commands = { path = "../crates/commands" }

# P1-03: Fluent UI tab_bar extractor (ADR 0007, ADR 0009).
calamine = "0.36"        # MIT; xlsx reader (>=0.36 pulls in quick-xml >=0.41
                         # which clears cargo-deny's RUSTSEC advisories
                         # RUSTSEC-2024-0001 and RUSTSEC-2025-0004)
# Same version + features as crates/ui-spec. The default features
# pull in reqwest for remote $ref resolution, which we do not need
# (ui-spec/schema.json only uses internal $refs) and whose webpki-roots
# dep is not an allowed licence in deny.toml.
jsonschema = { version = "0.58", default-features = false }
regex-lite = "0.1"       # MIT; small regex engine for the out-of-scope glob matcher
serde-saphyr = "1.3"     # MIT; pure-Rust YAML (replaces archived serde_yaml and
                         # advisory-flagged serde_yml; see ADR 0007)
# The same zip major as crates/vsdx (calamine still pins 8.x). Default
# features off: they pull in bzip2/zstd support whose licences are not in
# deny.toml. Used by the P1-08 fixture builder (tiny .xlsx workbooks for
# the extract --check tests) and by `cargo xtask scout classify`, which
# reads `docProps` and `[Content_Types].xml` of the wide corpus.
zip = { version = "9", default-features = false }

# R7: the macOS `.icns` rasteriser (`cargo xtask dist mac`). The same
# resvg 0.45 the desktop app rasterises its window icon with (ADR 0067,
# task P7-16): outline paths and gradients only, so no text or
# raster-image features. MIT OR Apache-2.0, already in the tree through
# `apps/larrygram` and egui_extras; invoked as a library, unlike the
# system tools (iconutil, hdiutil, codesign) which are only invoked.
resvg = { version = "0.45.1", default-features = false }

[dev-dependencies]
# Path dev-dep: prove the extractor and the runtime loader agree on
# the ui-spec format (P1-03 review M2). xtask is outside the layer
# rules (AGENTS.md section 6), so it may depend on crates/ui-spec.
larrygram-ui-spec = { path = "../crates/ui-spec" }
# Property tests (P1-08 goal 4).
proptest = "1"

[lints]
workspace = true
