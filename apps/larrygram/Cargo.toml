[package]
name = "larrygram"
description = "Larrygram desktop app (eframe/egui)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
# GUI stack (ADR 0030): eframe window and event loop over the L6 UI crate.
# Licences checked by cargo deny.
# The glow backend only (ADR 0030): no wgpu tree. `persistence` backs the
# settings store (ADR 0032).
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
# winit with its default features (rwh_06, x11, wayland, wayland-dlopen,
# wayland-csd-adwaita): eframe's own `default` list enables
# `winit/default`, and a dependency feature list cannot contain slashes,
# so the desktop app re-enables them directly (ADR 0030). Same 0.30 line
# eframe uses; the features unify in one build.
winit = "0.30"
larrygram-commands = { path = "../../crates/commands" }
larrygram-ui = { path = "../../crates/ui" }
larrygram-ui-spec = { path = "../../crates/ui-spec" }
# The window-icon rasteriser (ADR 0067, task P7-16): the same resvg
# 0.45 the ui crate rasterises its icons with (the `egui_extras` svg
# pin). The brand `icon.svg` is outline paths and gradients only, so
# no text or raster-image features. MIT OR Apache-2.0 (already in the
# tree through egui_extras).
resvg = { version = "0.45.1", default-features = false }

[dev-dependencies]
# Headless UI tests (ADR 0030, ADR 0037).
egui_kittest = "0.37"
# The exit-criterion test compares the canvas raster with
# `render_raster` of the same page (ADR 0033, ADR 0037).
larrygram-render = { path = "../../crates/render" }
# The exit-criterion flowchart test asserts the ADR 0048 model equality
# of the saved and reopened documents (ADR 0049, task P5-10).
larrygram-model = { path = "../../crates/model" }

# The macOS open-documents delegate (task R8, ADR 0073): the same
# objc2 family and versions eframe 0.37 already uses, so the features
# unify in one build. MIT OR Apache-2.0 (checked by cargo deny).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSObject",
    "NSString",
    "NSURL",
] }

# The workspace lint list, with one exception (ADR 0073): `unsafe`
# is denied rather than forbidden, so the one macOS delegate module
# (`macos_open_urls.rs`) can carry its own `#![allow(unsafe_code)]`.
# Cargo forbids mixing `lints.workspace = true` with overrides, so the
# list is spelled out here and must stay in step with `[workspace.lints]`
# in the root `Cargo.toml`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"
