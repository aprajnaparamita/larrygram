<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Larrygram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The favicon is the single brand icon.svg (ADR 0067): trunk
         copies the same file the desktop window icon rasterises. -->
    <link data-trunk rel="copy" href="../../crates/ui/assets/brand/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link data-trunk rel="rust" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #c0c0c0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- The app looks this canvas up by id (see src/main.rs). -->
    <canvas id="larrygram_canvas"></canvas>
  </body>
</html>
